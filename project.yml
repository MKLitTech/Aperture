name: Aperture
options:
  bundleIdPrefix: com.mklittech
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Aperture:
    type: application
    platform: iOS
    sources: [Aperture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mklittech.aperture
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Aperture
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Aperture registers as a camera app so Camera Control can launch it.
        LSApplicationQueriesSchemes:
          - instagram
          - whatsapp
          - tg
          - spotify
          - youtube
          - discord
          - maps
          - comgooglemaps
          - music
          - message
          - sms
          - tel
          - mobilenotes
          - photos-redirect
          - calshow
          - x-apple-reminderkit
          - shareddocuments
          - shoebox
          - twitter
          - reddit
          - snapchat
          - nflx
          - googlechrome
          - googlegmail
          - slack
          - uber
          - shortcuts
          - https
    dependencies:
      - target: ApertureCapture
        embed: true
  ApertureCapture:
    type: extensionkit-extension
    platform: iOS
    sources: [ApertureCapture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mklittech.aperture.capture
    info:
      path: Config/Capture-Info.plist
      properties:
        CFBundleDisplayName: Aperture
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.lockedcamera-capture
